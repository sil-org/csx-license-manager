name: Deploy Edge Functions

# Frontend hosting is AWS Amplify, connected directly to this repo — it
# builds and deploys itself on push to main, no GitHub Actions involved.
# This workflow only handles the one thing Amplify doesn't: Supabase Edge
# Functions (see supabase/functions/README.md).

on:
  push:
    branches: [main]

jobs:
  deploy-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Edge Functions
        run: supabase functions deploy --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
