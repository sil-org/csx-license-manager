customHeaders:
  # HSTS: tells browsers to only ever reach this site over HTTPS. Browsers
  # cache it for max-age seconds, so a mistake (e.g. a domain that turns out
  # to need plain HTTP) can't be undone faster than that. Ramp up in stages,
  # letting each one run cleanly before moving to the next:
  #   1. 3600      (1 hour)
  #   2. 86400     (1 day)
  #   3. 604800    (1 week)
  #   4. 2592000   (1 month)   <- current
  #   5. 31536000  (1 year)   final
  # Deliberately no includeSubDomains/preload — this app's hostname doesn't
  # own the subdomains beneath it, and preload is effectively irreversible.
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=2592000'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      # No camera/mic/geolocation/payment/USB — this app doesn't use any
      # browser feature beyond rendering a page, so deny them all.
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()'
      # script-src/style-src have no 'unsafe-inline': Vite only emits external,
      # content-hashed <script>/<link> tags, and the Google Fonts stylesheet is
      # loaded the same way — so a strict policy costs nothing today. That also
      # means CSP actually backstops the dangerouslySetInnerHTML calls in
      # Catalog.jsx (admin-entered license notes/acknowledgement text rendered
      # as HTML): if a <script> ever ended up in there, this blocks it from
      # running. img-src allows any https host because license logo_url is a
      # free-text admin field pointing at arbitrary vendor sites.
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https:; connect-src 'self' https://lxomebvymgolbzgkxqgu.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

  # Vite content-hashes JS/CSS filenames, so a given filename's content never
  # changes — safe to cache at the CDN and browser for a long time.
  - pattern: '**/*.@(js|css)'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.@(png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'

  # index.html is what NAMES the hashed JS/CSS files above. If the CDN or a
  # browser serves a stale index.html after a deploy, it points at filenames
  # that no longer exist — that 404 (with no error surfaced) is what shows up
  # as a white screen on load. These must always revalidate against origin.
  # Listed after the broad *.js rule above so their no-cache wins the merge
  # for sw.js/registerSW.js specifically.
  - pattern: '/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache'
  - pattern: '/sw.js'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache'
  - pattern: '/registerSW.js'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache'
  - pattern: '/manifest.webmanifest'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache'
