<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>License Manager</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- iOS Safari ignores the web manifest for these — has to be explicit
         HTML, or "Add to Home Screen" opens as a plain bookmark instead of
         a standalone app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="License Manager" />
    <meta name="theme-color" content="#005CB9" />
    <!-- SIL brand font: Source Sans 3 (body/UI). Headlines use Roboto, matching
         the GAS License Manager's actual look — its CSS asked for 'Google Sans'
         first, but that font isn't available outside Google's own properties,
         so Roboto (the next fallback) is what actually rendered for everyone. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
